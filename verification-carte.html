<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#071A45">
<title>Vérification de carte étudiante · IFSA University</title>
<link rel="icon" href="https://i.postimg.cc/8zMT8g8M/No-background.png">
<script>(function(){var r=document.documentElement,t='light';try{var v=localStorage.getItem('ifsa-theme');t=(v==='light'||v==='dark')?v:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}r.dataset.theme=t})();</script>
<style>
:root{--navy:#0B1F4B;--blue:#2563EB;--bg:#F1F4FA;--card:#fff;--ink:#1B2437;--mut:#5B667C;--line:#E1E6F2;--ok:#12663A;--okb:#DDF5E6;--no:#8F1D17;--nob:#FDE3E1}
[data-theme=dark]{--bg:#0A1230;--card:#111C3F;--ink:#E4EAF7;--mut:#9FB0D6;--line:#243256;--ok:#7BE3A8;--okb:#0F3B25;--no:#FFB4AE;--nob:#4A1613}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
header b{display:block;font-size:1.02rem;line-height:1.2}header small{color:#C3CFEA}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:22px 16px 40px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(11,31,75,.08)}
.st{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px 16px;font-weight:700;margin-bottom:18px}
.st.ok{background:var(--okb);color:var(--ok)}.st.no{background:var(--nob);color:var(--no)}
.st svg{width:28px;height:28px;flex:none}
h1{font-size:1.25rem;margin:0 0 6px;color:var(--navy)}[data-theme=dark] h1{color:#E4EAF7}
.nm{font-size:1.35rem;font-weight:800;margin:0 0 14px;overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
p.n{color:var(--mut);font-size:.84rem;margin:18px 0 0}
a.b{display:inline-block;margin-top:16px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px;min-height:46px}
.sk{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
@media(max-width:380px){dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="https://i.postimg.cc/8zMT8g8M/No-background.png" alt="" width="40" height="40"><div><b>IFSA University</b><small>Vérification de carte étudiante</small></div></header>
<main id="main" aria-live="polite">
<div class="box" id="box"><div class="sk" aria-hidden="true"></div></div>
</main>
<script>
(function(){
"use strict";
var URL_="https://feahvqexnoozmpkseate.supabase.co",KEY="sb_publishable_ivXCWsho2PYO1JH-1sUpRg_p-S91Z9X";
var box=document.getElementById("box");
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>';
var NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>';
function bad(title,msg){box.innerHTML='<div class="st no">'+NO+'<span>'+esc(title)+'</span></div><p>'+esc(msg)+'</p><a class="b" href="index.html">Aller sur le site IFSA University</a>'}
var t=(new URLSearchParams(location.search).get("t")||"").trim().toLowerCase();
if(!/^[0-9a-f]{64}$/.test(t)){bad("Carte non reconnue","Le lien ou le QR code est incomplet. Scannez de nouveau la carte.");return}
var row=function(k,v){return'<div><dt>'+k+'</dt><dd>'+esc(v||"—")+'</dd></div>'};
fetch(URL_+"/rest/v1/rpc/verify_student_card",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_token:t}),cache:"no-store"})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})
.then(function(c){
 if(!c||!c.valid){bad("Carte non valide","Cette carte n'existe pas, a été remplacée ou n'est plus active. En cas de doute, contactez le secrétariat.");return}
 box.innerHTML='<div class="st ok">'+OK+'<span>Carte valide : étudiant(e) actif(ve)</span></div><h1>Carte d\'étudiant IFSA University</h1><p class="nm">'+esc(c.full_name||"")+'</p><dl>'+row("Matricule",c.matricule)+row("Site",c.site)+row("Faculté",c.faculte)+row("Option",c.option)+row("Année",c.annee?"Année "+c.annee:"")+'</dl><p class="n">Vérification faite en direct auprès de la base de l\'université. Seules ces informations sont affichées.</p>';
 document.title="Carte valide · IFSA University";
}).catch(function(){bad("Vérification impossible","Le service est momentanément indisponible ou la connexion est coupée. Réessayez dans un instant.")});
})();
</script>
</body>
</html>
