function stuList(){const q=nz(S.f.q_stu||""),L=S.d.students.filter(s=>!q||nz([s.full_name,s.email,s.matricule,s.phone].join(" ")).includes(q));
return L.length?L.map(s=>'<div class="it"><div class="av">'+esc(init(s.full_name))+'</div><div class="tx"><b>'+esc(s.full_name)+'</b><small>'+esc(s.matricule||"")+(s.faculte?" · "+esc(s.faculte):"")+(s.annee?" · "+s.annee+"e année":"")+'</small><small>'+esc(s.email||"")+(s.phone?" · "+esc(s.phone):"")+'</small><div>'+stBadge(s.status)+'</div>'+
'<div class="ac"><button class="bt" type="button" data-act="lt-new" data-id="'+esc(s.id)+'">'+ic("file")+'Lettre</button><button class="bt" type="button" data-act="dis-new" data-id="'+esc(s.id)+'">'+ic("alert")+'Signaler</button></div></div></div>').join(""):empty("cap","Aucun étudiant.")}
function vStu(){return '<div class="pg-h"><div><h1>Étudiants</h1><p>'+S.d.students.length+' dossier(s) à '+esc(S.siteName)+'.</p></div></div><div class="bar"><div class="sr">'+ic("search")+'<input type="search" data-in="q" placeholder="Rechercher un nom, un matricule" value="'+esc(S.f.q_stu||"")+'" aria-label="Rechercher"></div></div><div id="lst">'+stuList()+'</div>'}
/* ----- Présences (appel) ----- */
function vAtt(){const f=S.f.att||(S.f.att={cls:"",date:today()});
const enr=S.d.enr.filter(e=>e.class_id===f.cls).map(e=>stu(e.student_id)).filter(Boolean).sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name)));
const ex={};(S.d.att||[]).forEach(a=>ex[a.student_id]=a.present);const saved=(S.d.att||[]).length>0;
let h='<div class="pg-h"><div><h1>Présences</h1><p>Faites l\'appel d\'une classe de '+esc(S.siteName)+' pour une date.</p></div></div><div class="card"><div class="row2"><label class="fl">Classe<select data-in="att-cls"><option value="">Choisir une classe</option>'+S.d.classes.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===f.cls?" selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select></label><label class="fl">Date<input type="date" data-in="att-date" value="'+esc(f.date)+'" max="'+today()+'"></label></div>';
if(!f.cls)h+='<p class="sub">Choisissez une classe pour afficher la liste des étudiants.</p>';
else if(!enr.length)h+=empty("users","Aucun étudiant inscrit dans cette classe. Le directeur d'antenne gère les inscriptions.");
else{h+=(saved?'<div class="msg info">Un appel existe déjà pour cette date : vous pouvez le corriger.</div>':"")+'<div class="ac" style="margin:0 0 8px"><button class="bt" type="button" data-act="att-all" data-v="1">Tout le monde présent</button><button class="bt" type="button" data-act="att-all" data-v="0">Tout le monde absent</button></div><div id="attl">'+
enr.map(s=>{const p=ex[s.id]===undefined?true:ex[s.id];return '<div class="it" style="margin-bottom:8px"><div class="av">'+esc(init(s.full_name))+'</div><div class="tx"><b>'+esc(s.full_name)+'</b><small>'+esc(s.matricule||"")+'</small><div class="seg" style="margin-top:6px"><label class="'+(p?"sel":"")+'"><input type="radio" name="p_'+esc(s.id)+'" value="1"'+(p?" checked":"")+'>Présent</label><label class="'+(p?"":"sel")+'"><input type="radio" name="p_'+esc(s.id)+'" value="0"'+(p?"":" checked")+'>Absent</label></div></div></div>'}).join("")+'</div><div class="ac"><button class="bt p" type="button" data-act="att-save">'+ic("check")+'Enregistrer l\'appel</button></div>'}
return h+'</div>'}
/* ----- Lettres, rapports, demandes de documents ----- */
const docObj=d=>d.kind==="letter"?{type:"letter",title:d.title,body:d.body||"",to:(stu(d.student_id)?stu(d.student_id).full_name+(stu(d.student_id).matricule?" — "+stu(d.student_id).matricule:""):""),date:d.created_at}:{type:"report",title:d.title,body:d.body||"",to:"La direction centrale — Administration et direction générale",date:d.created_at};
function vDocs(){const R=pendingReq(),L=S.d.docs;
return '<div class="pg-h"><div><h1>Lettres et rapports</h1><p>Rédigez des documents officiels avec logo, à imprimer ou à télécharger, et transmettez rapports et remarques à la centrale.</p></div><div class="ac" style="margin:0"><button class="bt p" type="button" data-act="lt-new">'+ic("file")+'Nouvelle lettre</button><button class="bt" type="button" data-act="rp-new">'+ic("send")+'Rapport / remarque</button></div></div>'+
'<div class="card"><h2>Demandes de documents des étudiants</h2>'+(R.length?R.map(r=>'<div class="it" style="margin-bottom:8px"><div class="av">'+esc(init((stu(r.student_id)||{}).full_name))+'</div><div class="tx"><b>'+esc((stu(r.student_id)||{}).full_name||"Étudiant")+' — '+esc(r.doc_type)+'</b><small>Demandé le '+esc(fmtD(r.created_at))+'</small><div class="ac"><button class="bt p" type="button" data-act="lt-new" data-id="'+esc(r.student_id)+'" data-t="'+esc(r.doc_type)+'">'+ic("file")+'Rédiger</button><button class="bt" type="button" data-act="rq-done" data-id="'+esc(r.id)+'">Marquer traité</button></div></div></div>').join(""):empty("check","Aucune demande en attente."))+'</div>'+
'<div class="card"><h2>Documents du secrétariat</h2>'+(L.length?L.map(d=>'<div class="it"><div class="av">'+ic(d.kind==="letter"?"file":"send")+'</div><div class="tx"><b>'+esc(d.title)+'</b><small>'+esc(fmtD(d.created_at))+(d.kind==="letter"&&stu(d.student_id)?" · pour "+esc(stu(d.student_id).full_name):"")+(nameOf(d.created_by)?" · "+esc(nameOf(d.created_by)):"")+'</small><div><span class="bd">'+(KL[d.kind]||d.kind)+'</span>'+(d.kind!=="letter"?'<span class="bd '+(d.read_at?"ok":"wa")+'">'+(d.read_at?"Lu par la centrale le "+esc(fmtD(d.read_at)):"Transmis à la centrale")+'</span>':"")+'</div>'+
'<div class="ac"><button class="bt" type="button" data-act="doc-print" data-id="'+esc(d.id)+'">'+ic("file")+'Imprimer / PDF</button><button class="bt" type="button" data-act="doc-dl" data-id="'+esc(d.id)+'">Word</button>'+(d.kind==="letter"?'<button class="bt d" type="button" data-act="doc-rm" data-id="'+esc(d.id)+'">'+ic("trash")+'Supprimer</button>':"")+'</div></div></div>').join(""):empty("file","Aucun document pour le moment."))+'</div>'}
const TPL={free:{l:"Lettre libre",t:()=>"",b:()=>""},
attest:{l:"Attestation d'inscription",t:()=>"Attestation d'inscription",b:s=>"Je soussigné(e), "+(S.me.full_name||"")+", Censeur / Secrétaire du site de "+S.siteName+", atteste que "+(s?s.full_name:"........")+(s&&s.matricule?", matricule "+s.matricule:"")+", est régulièrement inscrit(e) à IFSA University"+(s&&s.faculte?", faculté « "+s.faculte+" »":"")+(s&&s.annee?", "+s.annee+"e année":"")+".\n\nCette attestation est délivrée à l'intéressé(e) pour servir et valoir ce que de droit."},
convoc:{l:"Convocation",t:()=>"Convocation",b:s=>"Madame, Monsieur,\n\nVous êtes prié(e) de vous présenter au secrétariat du site de "+S.siteName+" le ........ à ........ h, pour un entretien concernant votre dossier"+(s?" ("+s.full_name+")":"")+".\n\nVeuillez agréer l'expression de nos salutations distinguées."}};
function letterForm(sid,title){const st=S.d.students;
const el=modal('<h2>Nouvelle lettre</h2><p class="sub">Lettre adressée à un étudiant de '+esc(S.siteName)+'. Il la retrouve dans son espace.</p><div class="msg err" id="fe" hidden></div>'+
'<label class="fl">Étudiant<select id="ls"><option value="">Choisir un étudiant</option>'+st.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===sid?" selected":"")+'>'+esc(s.full_name)+(s.matricule?" — "+esc(s.matricule):"")+'</option>').join("")+'</select></label>'+
'<label class="fl">Modèle<select id="lm">'+Object.keys(TPL).map(k=>'<option value="'+k+'">'+esc(TPL[k].l)+'</option>').join("")+'</select></label>'+
'<label class="fl">Objet<input id="lt" maxlength="140" autocomplete="off" value="'+esc(title||"")+'"></label><label class="fl">Texte de la lettre<textarea id="lb" maxlength="6000" style="min-height:180px"></textarea></label>'+
'<div class="ac"><button class="bt p" type="button" id="go">Enregistrer</button><button class="bt" type="button" id="cn">Annuler</button></div>');
const fill=()=>{const k=el.querySelector("#lm").value,s=stu(el.querySelector("#ls").value);if(k==="free")return;el.querySelector("#lt").value=TPL[k].t();el.querySelector("#lb").value=TPL[k].b(s)};
el.querySelector("#lm").onchange=fill;el.querySelector("#ls").onchange=()=>{if(el.querySelector("#lm").value!=="free")fill()};
el.querySelector("#cn").onclick=closeModal;
el.querySelector("#go").onclick=e=>{const er=el.querySelector("#fe"),bad=m=>{er.textContent=m;er.hidden=false},s=el.querySelector("#ls").value,t=el.querySelector("#lt").value.trim(),b=el.querySelector("#lb").value.trim();
if(!s)return bad("Choisissez l'étudiant.");if(t.length<3)return bad("Indiquez l'objet de la lettre.");if(b.length<5)return bad("Rédigez le texte de la lettre.");
run(e.currentTarget,async()=>{must(await sb.from("site_documents").insert({kind:"letter",site_id:S.site,student_id:s,title:t,body:b}));await refresh();
const o={type:"letter",title:t,body:b,to:(stu(s).full_name+(stu(s).matricule?" — "+stu(s).matricule:"")),date:new Date().toISOString()};
const m=modal('<h2>Lettre enregistrée</h2><p class="sub">Elle est visible par l\'étudiant. Vous pouvez l\'imprimer ou la télécharger.</p><div class="ac"><button class="bt p" type="button" id="pp">'+ic("file")+'Imprimer / PDF</button><button class="bt" type="button" id="pw">Word</button><button class="bt" type="button" id="cl">Fermer</button></div>');
m.querySelector("#pp").onclick=()=>printDoc(o);m.querySelector("#pw").onclick=()=>downloadDoc(o);m.querySelector("#cl").onclick=closeModal},"Lettre enregistrée.")}}
function reportForm(){const el=modal('<h2>Rapport ou remarque à la centrale</h2><p class="sub">Transmis directement à l\'administration et à la direction générale. Le directeur d\'antenne de '+esc(S.siteName)+' le voit aussi.</p><div class="msg err" id="fe" hidden></div>'+
'<div class="fl">Type<div class="seg"><label class="sel"><input type="radio" name="k" value="report" checked>Rapport</label><label><input type="radio" name="k" value="remark">Remarque</label></div></div><label class="fl">Titre<input id="rt" maxlength="140" autocomplete="off"></label><label class="fl">Contenu<textarea id="rb" maxlength="6000" style="min-height:160px"></textarea></label>'+
'<div class="ac"><button class="bt p" type="button" id="go">'+ic("send")+'Transmettre</button><button class="bt" type="button" id="cn">Annuler</button></div>');
el.querySelectorAll("input[name=k]").forEach(r=>r.onchange=()=>el.querySelectorAll(".seg label").forEach(l=>l.classList.toggle("sel",l.firstChild.checked)));
el.querySelector("#cn").onclick=closeModal;
el.querySelector("#go").onclick=e=>{const er=el.querySelector("#fe"),bad=m=>{er.textContent=m;er.hidden=false},t=el.querySelector("#rt").value.trim(),b=el.querySelector("#rb").value.trim();
if(t.length<3)return bad("Donnez un titre.");if(b.length<5)return bad("Rédigez le contenu.");
run(e.currentTarget,async()=>{must(await sb.from("site_documents").insert({kind:el.querySelector("input[name=k]:checked").value,site_id:S.site,title:t,body:b}));closeModal();await refresh()},"Transmis à la direction centrale.")}}
/* ----- actions ----- */
const ACT=Object.assign({},ANN_ACT,DIS_ACT,{
"req-f":(b,d)=>{S.f.req=d.f;draw()},
"lt-new":(b,d)=>letterForm(d&&d.id,d&&d.t),
"rp-new":()=>reportForm(),
"rq-done":(b,d)=>run(b,async()=>{must(await sb.from("doc_requests").update({status:"done"}).eq("id",d.id));await refresh()},"Demande marquée comme traitée."),
"doc-print":(b,d)=>{const x=S.d.docs.find(y=>y.id===d.id);if(x)printDoc(docObj(x))},
"doc-dl":(b,d)=>{const x=S.d.docs.find(y=>y.id===d.id);if(x)downloadDoc(docObj(x))},
"doc-rm":async(b,d)=>{if(await ask({title:"Supprimer cette lettre ?",text:"L'étudiant ne la verra plus dans son espace.",ok:"Supprimer",danger:true}))run(b,async()=>{must(await sb.from("site_documents").delete().eq("id",d.id));await refresh()},"Lettre supprimée.")},
"att-all":(b,d)=>{document.querySelectorAll('#attl input[type=radio][value="'+d.v+'"]').forEach(r=>{r.checked=true});document.querySelectorAll("#attl .seg").forEach(s=>s.querySelectorAll("label").forEach(l=>l.classList.toggle("sel",l.firstChild.checked)))},
"att-save":b=>{const f=S.f.att,rows=[];document.querySelectorAll("#attl input[type=radio]:checked").forEach(r=>rows.push({class_id:f.cls,student_id:r.name.slice(2),session_date:f.date,present:r.value==="1",marked_by:S.me.id}));
if(!rows.length)return;const ab=rows.filter(r=>!r.present).length;
run(b,async()=>{must(await sb.from("attendance").upsert(rows,{onConflict:"class_id,student_id,session_date"}));await refresh()},"Appel enregistré : "+(rows.length-ab)+" présent(s), "+ab+" absent(s).")}});
const INP={"q":t=>{S.f["q_"+S.tab]=t.value;const l=$("lst");if(l)l.innerHTML=S.tab==="req"?reqList():stuList()},
"att-cls":async t=>{S.f.att=S.f.att||{cls:"",date:today()};S.f.att.cls=t.value;await run(null,async()=>{await loadAtt();draw()})},
"att-date":async t=>{S.f.att=S.f.att||{cls:"",date:today()};if(!t.value)return;S.f.att.date=t.value;await run(null,async()=>{await loadAtt();draw()})}};
document.addEventListener("change",e=>{const r=e.target.closest&&e.target.closest("#attl input[type=radio]");if(r){r.closest(".seg").querySelectorAll("label").forEach(l=>l.classList.toggle("sel",l.firstChild.checked))}});
boot({role:"secretary",title:"Espace censeur / secrétaire",load,actions:ACT,inputs:INP,tabs:[
{id:"ov",label:"Aperçu",icon:"grid",view:vOv,badge:()=>0},{id:"req",label:"Inscriptions",icon:"inbox",view:vReq},{id:"stu",label:"Étudiants",icon:"cap",view:vStu},
{id:"att",label:"Présences",icon:"check",view:vAtt},{id:"docs",label:"Lettres et rapports",icon:"file",view:vDocs,badge:()=>pendingReq().length},
{id:"ann",label:"Annonces",icon:"mega",view:viewAnnonces},{id:"dis",label:"Discipline",icon:"shield",view:viewDiscipline,badge:()=>0}]});

})();
</script>
</body>
</html>
