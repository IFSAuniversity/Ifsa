<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualités — IFSA University</title><meta name="description" content="Les actualités d'IFSA University.">
<link rel="icon" href="https://i.postimg.cc/8zMT8g8M/No-background.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body data-page="actualites.html">
<section class="hero page-hero"><div class="wrap"><h1>Actualités</h1><p>La vie de l'université : annonces, campus, événements et vie académique.</p></div></section>
<section><div class="wrap"><div id="feat"></div><div class="ft" id="ft"></div><div class="grid3" id="g"></div><p id="none" style="display:none;text-align:center;color:var(--mut)">Aucun article ne correspond.</p></div></section>
<section class="dark"><div class="wrap grid2"><div class="rv"><h2>Restez informé(e)</h2><p>Recevez les actualités d'IFSA par email.</p></div><form class="rv" id="nl"><div class="nl"><input type="email" required placeholder="Votre email" aria-label="Email"><button class="btn btn-gold">S'abonner</button></div><p id="nm" style="margin-top:10px"></p></form></div></section>
<script>/* Modifier les articles ici : [catégorie, titre, résumé, date] */
const N=[["Admissions", "Inscriptions ouvertes pour la nouvelle promotion", "Les inscriptions sont ouvertes sur nos quatre sites. Découvrez la procédure et les pièces à fournir.", "2026-10-01"], ["Campus", "Titre d'une actualité de campus", "Texte de l'article à remplacer par le contenu réel.", "2026-09-24"], ["Événements", "Titre d'un événement", "Texte de l'événement à remplacer par le contenu réel.", "2026-09-15"], ["Académique", "Titre d'une actualité académique", "Texte de l'article à remplacer par le contenu réel.", "2026-09-05"], ["Campus", "Vie étudiante sur nos sites", "Texte de l'article à remplacer par le contenu réel.", "2026-08-28"], ["Admissions", "Calendrier des examens", "Texte de l'article à remplacer par le contenu réel.", "2026-08-20"]];let cat='Tous';
const nz=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const card=a=>'<article class="art"><div class="ph"></div><div class="t"><span class="tag">'+a[0]+'</span><h3>'+a[1]+'</h3><p style="color:var(--mut);font-size:.9rem">'+a[2]+'</p><small>'+fmt(a[3])+'</small></div></article>';
const cats=['Tous',...new Set(N.map(a=>a[0]))];
ft.innerHTML=cats.map(c=>'<button class="'+(c=='Tous'?'on':'')+'">'+c+'</button>').join('')+'<input class="srch" id="q" placeholder="Rechercher…" aria-label="Rechercher">';
const R=()=>{const q=nz(q_.value),L=N.filter(a=>(cat=='Tous'||a[0]==cat)&&nz(a[1]+a[2]).includes(q));const [f,...r]=L;
feat.innerHTML=f?'<article class="feat"><div class="ph"></div><div class="t"><span class="tag">'+f[0]+' · À la une</span><h2>'+f[1]+'</h2><p style="color:var(--mut)">'+f[2]+'</p><small>'+fmt(f[3])+'</small></div></article>':'';g.innerHTML=r.map(card).join('');none.style.display=L.length?'none':'block'};
const q_=document.getElementById('q');q_.oninput=R;ft.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.textContent;ft.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));R()});R();
nl.onsubmit=e=>{e.preventDefault();nm.textContent='Merci ! Votre inscription sera activée une fois le service branché.';nl.reset()};</script><script src="assets/app.js"></script></body></html>
